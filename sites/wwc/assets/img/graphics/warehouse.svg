<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Centro logístico y almacenamiento">
  <defs>
    <linearGradient id="whSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#E6EDF7"/>
    </linearGradient>
    <linearGradient id="whAcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19D3C5"/><stop offset="1" stop-color="#0FA89D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#whSky)"/>
  <!-- floor -->
  <rect y="430" width="800" height="170" fill="#DDE5F0"/>
  <g stroke="#C6D2E3" stroke-width="2">
    <line x1="0" y1="470" x2="800" y2="470"/><line x1="0" y1="520" x2="800" y2="520"/>
  </g>
  <!-- building shell -->
  <path d="M90 430V196l310-96 310 96v234z" fill="#FFFFFF" stroke="#C6D2E3" stroke-width="3"/>
  <path d="M90 196l310-96 310 96" fill="none" stroke="#19D3C5" stroke-width="5" stroke-linejoin="round"/>
  <!-- racks -->
  <g fill="#EEF2F8" stroke="#C6D2E3" stroke-width="2.5">
    <rect x="130" y="250" width="150" height="180"/><rect x="325" y="250" width="150" height="180"/><rect x="520" y="250" width="150" height="180"/>
  </g>
  <g stroke="#C6D2E3" stroke-width="2">
    <line x1="130" y1="310" x2="280" y2="310"/><line x1="130" y1="370" x2="280" y2="370"/>
    <line x1="325" y1="310" x2="475" y2="310"/><line x1="325" y1="370" x2="475" y2="370"/>
    <line x1="520" y1="310" x2="670" y2="310"/><line x1="520" y1="370" x2="670" y2="370"/>
  </g>
  <!-- boxes on racks -->
  <g fill="#FFAE34">
    <rect x="142" y="268" width="38" height="36" rx="3"/><rect x="196" y="268" width="38" height="36" rx="3"/>
    <rect x="337" y="328" width="38" height="36" rx="3"/><rect x="391" y="268" width="38" height="36" rx="3"/>
    <rect x="532" y="268" width="38" height="36" rx="3"/><rect x="586" y="388" width="38" height="36" rx="3"/>
  </g>
  <g fill="url(#whAcc)">
    <rect x="250" y="328" width="38" height="36" rx="3"/><rect x="337" y="268" width="38" height="36" rx="3"/>
    <rect x="445" y="388" width="38" height="36" rx="3"/><rect x="532" y="328" width="38" height="36" rx="3"/>
    <rect x="142" y="388" width="38" height="36" rx="3"/>
  </g>
  <!-- forklift -->
  <g transform="translate(300,360)">
    <rect x="0" y="22" width="68" height="40" rx="6" fill="#0F1A2E"/>
    <rect x="8" y="0" width="34" height="26" rx="4" fill="#16243d"/>
    <rect x="68" y="6" width="6" height="56" fill="#64748B"/>
    <rect x="74" y="50" width="30" height="6" fill="#64748B"/>
    <rect x="76" y="14" width="30" height="34" rx="3" fill="#FFAE34"/>
    <circle cx="16" cy="64" r="12" fill="#1F3350"/><circle cx="56" cy="64" r="12" fill="#1F3350"/>
    <circle cx="16" cy="64" r="4.5" fill="#8A99AF"/><circle cx="56" cy="64" r="4.5" fill="#8A99AF"/>
  </g>
  <!-- truck at bay -->
  <g transform="translate(600,352)">
    <rect x="0" y="0" width="112" height="60" rx="5" fill="#FFFFFF" stroke="#C6D2E3" stroke-width="2.5"/>
    <rect x="112" y="18" width="52" height="42" rx="6" fill="#19D3C5"/>
    <rect x="124" y="26" width="26" height="18" rx="3" fill="#0F1A2E" opacity=".3"/>
    <circle cx="34" cy="68" r="13" fill="#1F3350"/><circle cx="90" cy="68" r="13" fill="#1F3350"/><circle cx="140" cy="68" r="13" fill="#1F3350"/>
    <circle cx="34" cy="68" r="5" fill="#8A99AF"/><circle cx="90" cy="68" r="5" fill="#8A99AF"/><circle cx="140" cy="68" r="5" fill="#8A99AF"/>
  </g>
</svg>
