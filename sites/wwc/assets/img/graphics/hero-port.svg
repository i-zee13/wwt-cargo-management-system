    <path d="M30 520v54M48 520v54M66 520v54M84 520v54M102 520v54"/>
    <path d="M142 492v82M160 492v82M178 492v82M196 492v82M214 492v82"/>
    <path d="M254 520v54M272 520v54M290 520v54M308 520v54M326 520v54"/>
    <path d="M366 464v110M384 464v110M402 464v110M420 464v110M438 464v110"/>
  </g>
</g>

<!-- ══ SEA ══ -->
<rect y="620" width="1920" height="460" fill="url(#sea)"/>
<g stroke="#5FA7CC" stroke-opacity=".22" stroke-width="2" fill="none">
  <path d="M0 664q60-9 120 0t120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0 120 0"/>
  <path d="M0 716q70-11 140 0t140 0 140 0 140 0 140 0 140 0 140 0 140 0 140 0 140 0 140 0 140 0 140 0"/>
  <path d="M0 790q80-12 160 0t160 0 160 0 160 0 160 0 160 0 160 0 160 0 160 0 160 0 160 0 160 0"/>
  <path d="M0 884q90-14 180 0t180 0 180 0 180 0 180 0 180 0 180 0 180 0 180 0 180 0 180 0"/>
  <path d="M0 990q100-15 200 0t200 0 200 0 200 0 200 0 200 0 200 0 200 0 200 0 200 0"/>
</g>
<!-- sun glitter -->
<g fill="#FFD9A0" opacity=".28">
  <ellipse cx="1420" cy="672" rx="150" ry="5"/><ellipse cx="1420" cy="704" rx="200" ry="6"/>
  <ellipse cx="1420" cy="748" rx="160" ry="5"/><ellipse cx="1420" cy="800" rx="230" ry="7"/>
  <ellipse cx="1420" cy="866" rx="180" ry="6"/><ellipse cx="1420" cy="946" rx="250" ry="8"/>
</g>

<!-- ══ CONTAINER SHIP ══ -->
<g transform="translate(700,560)">
  <!-- container stacks on deck -->
  <g>
    <rect x="80"  y="40" width="118" height="28" rx="2" fill="#2E7FA8"/>
    <rect x="80"  y="10" width="118" height="28" rx="2" fill="#E8551C"/>
    <rect x="204" y="40" width="118" height="28" rx="2" fill="#4FA06B"/>
    <rect x="204" y="10" width="118" height="28" rx="2" fill="#D8D2C6"/>
    <rect x="204" y="-20" width="118" height="28" rx="2" fill="#2E7FA8"/>
    <rect x="328" y="40" width="118" height="28" rx="2" fill="#C9A227"/>
    <rect x="328" y="10" width="118" height="28" rx="2" fill="#B23A2A"/>
    <rect x="328" y="-20" width="118" height="28" rx="2" fill="#4FA06B"/>
