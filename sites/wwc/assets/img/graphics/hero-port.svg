    <rect x="-60" y="246" width="520" height="16" fill="#E8551C"/>
    <path d="M-60 254l-80 58 10 12 80-56z" fill="#E8551C"/>
    <rect x="150" y="262" width="54" height="40" fill="#24384F"/>
    <line x1="120" y1="262" x2="120" y2="420" stroke="#15222F" stroke-width="4"/>
    <rect x="92" y="420" width="56" height="34" rx="3" fill="#2E4967"/>
    <g fill="#1A2A3C"><rect x="52" y="604" width="36" height="22" rx="3"/><rect x="242" y="604" width="36" height="22" rx="3"/></g>
  </g>
  <!-- crane B -->
  <g transform="translate(560,34) scale(.92)">
    <path d="M60 620V300h18v320z" fill="url(#craneG)"/>
    <path d="M250 620V300h18v320z" fill="url(#craneG)"/>
    <rect x="40" y="276" width="250" height="26" fill="url(#craneG)"/>
    <rect x="-60" y="246" width="520" height="16" fill="#E8551C"/>
    <path d="M-60 254l-80 58 10 12 80-56z" fill="#E8551C"/>
    <rect x="150" y="262" width="54" height="40" fill="#24384F"/>
    <line x1="330" y1="262" x2="330" y2="380" stroke="#15222F" stroke-width="4"/>
    <rect x="302" y="380" width="56" height="34" rx="3" fill="#F2A33C"/>
    <g fill="#1A2A3C"><rect x="52" y="604" width="36" height="22" rx="3"/><rect x="242" y="604" width="36" height="22" rx="3"/></g>
  </g>
  <!-- crane C (far, faded) -->
  <g transform="translate(1080,86) scale(.8)" opacity=".75">
    <path d="M60 620V300h18v320z" fill="#D9552A"/>
    <path d="M250 620V300h18v320z" fill="#D9552A"/>
    <rect x="40" y="276" width="250" height="26" fill="#D9552A"/>
    <rect x="-60" y="246" width="520" height="16" fill="#C94C22"/>
    <path d="M-60 254l-80 58 10 12 80-56z" fill="#C94C22"/>
    <rect x="150" y="262" width="54" height="40" fill="#24384F"/>
  </g>
</g>

<!-- ══ CONTAINER YARD (left dock) ══ -->
<g>
  <rect x="0" y="596" width="520" height="34" fill="#243849"/>
  <g>
    <rect x="18"  y="548" width="104" height="26" rx="2" fill="#E8551C"/>
    <rect x="18"  y="520" width="104" height="26" rx="2" fill="#2E7FA8"/>
    <rect x="130" y="548" width="104" height="26" rx="2" fill="#4FA06B"/>
    <rect x="130" y="520" width="104" height="26" rx="2" fill="#E8551C"/>
    <rect x="130" y="492" width="104" height="26" rx="2" fill="#D8D2C6"/>
