  <ellipse cx="140" cy="44" rx="42" ry="7" fill="#FFFFFF" opacity=".45"/>
</g>

<!-- vignette for text legibility -->
<rect width="1920" height="1080" fill="url(#vig)"/>
<defs>
  <linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06121F" stop-opacity=".88"/>
    <stop offset="42%" stop-color="#06121F" stop-opacity=".45"/>
