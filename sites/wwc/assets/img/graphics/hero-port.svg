<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Puerto de contenedores con buque de carga y grúas pórtico">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#0B2C4A"/>
    <stop offset="38%" stop-color="#1D5A86"/>
    <stop offset="68%" stop-color="#3E8CB4"/>
    <stop offset="100%" stop-color="#7FB8D4"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#2E79A4"/>
    <stop offset="45%" stop-color="#1B557C"/>
    <stop offset="100%" stop-color="#0D3354"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFD9A0" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1C2C3F"/><stop offset="100%" stop-color="#0E1B2A"/>
  </linearGradient>
  <linearGradient id="hullRed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C4432A"/><stop offset="100%" stop-color="#8E2D1A"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFC178" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#FFC178" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="craneG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F0591F"/><stop offset="100%" stop-color="#C8420F"/>
  </linearGradient>
</defs>

<!-- SKY -->
<rect width="1920" height="620" fill="url(#sky)"/>
<circle cx="1420" cy="560" r="300" fill="url(#glow)"/>
<circle cx="1420" cy="572" r="52" fill="#FFD9A0" opacity=".9"/>

<!-- clouds -->
<g fill="#FFFFFF" opacity=".10">
  <ellipse cx="300" cy="150" rx="210" ry="38"/><ellipse cx="420" cy="132" rx="150" ry="30"/>
  <ellipse cx="1180" cy="110" rx="250" ry="34"/><ellipse cx="1320" cy="96" rx="160" ry="26"/>
  <ellipse cx="760" cy="210" rx="180" ry="26"/>
</g>

<!-- distant skyline -->
<g fill="#0D2B46" opacity=".55">
  <rect x="60"  y="470" width="46" height="150"/><rect x="118" y="500" width="34" height="120"/>
  <rect x="166" y="452" width="56" height="168"/><rect x="236" y="492" width="40" height="128"/>
  <rect x="292" y="476" width="30" height="144"/>
  <rect x="1660" y="486" width="44" height="134"/><rect x="1716" y="458" width="34" height="162"/>
  <rect x="1762" y="500" width="52" height="120"/><rect x="1828" y="474" width="36" height="146"/>
</g>

