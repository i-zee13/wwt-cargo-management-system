      <path d="M346 -50v118M366 -50v118M386 -50v118M406 -50v118M426 -50v118"/>
      <path d="M470 -50v118M490 -50v118M510 -50v118M530 -50v118M550 -50v118"/>
      <path d="M594 -50v118M614 -50v118M634 -50v118M654 -50v118M674 -50v118"/>
    </g>
  </g>
  <!-- superstructure -->
